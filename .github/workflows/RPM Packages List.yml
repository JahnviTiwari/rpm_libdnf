name: RPM Packages List

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  list-packages:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install rpm tools (since ubuntu-latest runner may not have rpm)
      - name: Install rpm tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      # 3. List all installed RPM packages
      - name: List installed RPM packages
        run: |
          rpm -qa --queryformat '%{NAME} %{VERSION}-%{RELEASE}\n' > packages.txt

      # 4. Upload package list as artifact
      - name: Upload package list
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: packages.txt
