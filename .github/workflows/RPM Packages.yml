name: Extract RPM Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract packages from libdnf.spec
        run: |
          SPEC_FILE="rpm_libdnf/libdnf.spec"

          if [ ! -f "$SPEC_FILE" ]; then
            echo "Spec file not found: $SPEC_FILE"
            touch packages.txt
            exit 1
          fi

          echo "Extracting Requires/BuildRequires from $SPEC_FILE..."

          grep -hE '^(Requires|BuildRequires):' "$SPEC_FILE" | \
          sed -E 's/^(Requires|BuildRequires):\s*//g' | \
          tr ',' '\n' | \
          tr ' ' '\n' | \
          sed -E 's/[><=]+.*$//g' | \
          grep -v '^[%{]' | \
          grep -v '^$' | \
          sort -u > packages.txt

          echo "Extracted package names:"
          cat packages.txt

      - name: Upload packages.txt
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-list
          path: packages.txt
